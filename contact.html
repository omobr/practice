<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>通讯录管理系统</title>
  <style>
    /* 这里写通讯录专属的样式，和主页保持一致的设计风格 */
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #f5f6fa;
      color: #333;
      line-height: 1.6;
      padding: 40px 20px;
    }
    
    .container {
      background-color: #ffffff;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    h1 {
      color: #EE82EE; /* 保持你的粉色标题 */
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* 返回按钮 */
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: #4a6cf7;
      text-decoration: none;
      font-size: 14px;
    }
    .back-btn:hover {
      text-decoration: underline;
    }

    /* 输入区 */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .input-group input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      min-width: 120px;
      outline: none;
    }
    
    .input-group input:focus {
      border-color: #4a6cf7;
    }

    button {
      padding: 10px 20px;
      background-color: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    button:hover {
      background-color: #3852d6;
    }

    /* 列表区 */
    #contactList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .contact-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fafafa;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #EE82EE;
    }

    .contact-info strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .contact-info span {
      font-size: 13px;
      color: #777;
    }

    .delete-btn {
      background-color: #ff4d4f;
      padding: 6px 12px;
      font-size: 12px;
    }
    .delete-btn:hover {
      background-color: #ff7875;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 返回主页的链接 -->
    <a href="index.html" class="back-btn">← 返回主页</a>
    
    <h1>通讯录管理系统</h1>
    
    <div class="input-group">
      <input type="text" id="phoneInput" placeholder="输入电话">
      <input type="text" id="nameInput" placeholder="输入姓名">
      <input type="text" id="addrInput" placeholder="输入地址">
      <button id="addBtn">添加</button>
    </div>

    <ul id="contactList">
      <!-- 数据会渲染在这里 -->
    </ul>
  </div>

  <script>
   // 1. 尝试从本地存储读取数据
		// 相当于 C 语言里的 Read() 函数
		var savedData = localStorage.getItem('myContacts');
		var contacts = [];
		
		if (savedData) {
		  // 如果以前存过数据，就把字符串转换回数组对象
		  contacts = JSON.parse(savedData); 
		}
		
		var phoneInput = document.getElementById('phoneInput');
		var nameInput = document.getElementById('nameInput');
		var addrInput = document.getElementById('addrInput');
		var addBtn = document.getElementById('addBtn');
		var contactList = document.getElementById('contactList');
		
		// 新增一个保存数据的函数
		// 相当于 C 语言里的 Save() 函数
		function saveData() {
		  // 把当前的 contacts 数组转换成字符串，存入浏览器
		  localStorage.setItem('myContacts', JSON.stringify(contacts));
		}
		
		function renderList() {
		  contactList.innerHTML = '';
		  if (contacts.length === 0) {
		    contactList.innerHTML = '<p style="color:#999; text-align:center;">通讯录为空，请添加联系人。</p>';
		    return;
		  }
		  for (var i = 0; i < contacts.length; i++) {
		    var item = contacts[i];
		    var li = document.createElement('li');
		    li.className = 'contact-item';
		    li.innerHTML = `
		      <div class="contact-info">
		        <strong>${item.name}</strong>
		        <span>📞 ${item.phone} | 📍 ${item.addr}</span>
		      </div>
		      <button class="delete-btn" onclick="deleteContact(${i})">删除</button>
		    `;
		    contactList.appendChild(li);
		  }
		}
		
		addBtn.onclick = function() {
		  var phone = phoneInput.value.trim();
		  var name = nameInput.value.trim();
		  var addr = addrInput.value.trim();
		
		  if (phone === '' || name === '') {
		    alert('电话和姓名不能为空！');
		    return;
		  }
		
		  contacts.push({ phone: phone, name: name, addr: addr });
		  
		  // 添加成功后，保存数据！
		  saveData();
		
		  phoneInput.value = '';
		  nameInput.value = '';
		  addrInput.value = '';
		
		  renderList();
		};
		
		function deleteContact(index) {
		  contacts.splice(index, 1);
		  
		  // 删除成功后，也要保存数据！
		  saveData();
		  
		  renderList();
		}
		
		// 初始化页面时渲染一次列表
		renderList();
  </script>
</body>
</html>
